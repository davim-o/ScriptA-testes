{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptA</title>
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
</head>

<body>

<header>
    <img src="{% static 'imgs/logo.png' %}" alt="Logo ScriptA">
    <h1>Participe da torcida</h1>
</header>

<main>

    <section class="imagens">
        <img src="{% static 'imgs/tigre.png' %}" alt="Tigre">
        <img src="{% static 'imgs/cobra.png' %}" alt="Cobra">
        <img src="{% static 'imgs/dragao.png' %}" alt="Dragão">
        <img src="{% static 'imgs/cavalo.png' %}" alt="Cavalo">
    </section>

    <form method="POST" id="form-cadastro">
        {% csrf_token %}

        <section class="formula">

            {% if erro %}
            <p class="erro-login">{{ erro }}</p>
            {% endif %}

            <div class="mat">
                <p>Matrícula</p>
                <input type="text" name="matricula" placeholder="Digite sua matrícula (apenas números)"
                       value="{{ form.matricula }}" inputmode="numeric" pattern="[0-9]+" maxlength="20">
            </div>

            <div class="senha">
                <p>Senha</p>
                <div class="campo-senha">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="diretoria">
                <p>Diretoria</p>
                <div class="dropdown">
                    <button type="button" class="dropdown-btn" id="abrirDiretoria">
                        <span id="textoDiretoria">{% if form.diretoria %}{{ form.diretoria }}{% else %}Selecione uma diretoria{% endif %}</span>
                        <img class="seta" id="setaDiretoria" src="{% static 'imgs/seta-baixo.png' %}" alt="">
                    </button>
                    <div class="lista" id="listaDiretoria">
                        <div class="opcao-diretoria">Diaren</div>
                        <div class="opcao-diretoria">Diatinf</div>
                        <div class="opcao-diretoria">Diacon</div>
                        <div class="opcao-diretoria">Diacin</div>
                    </div>
                </div>
            </div>

            <input type="hidden" name="diretoria" id="diretoriaSelecionada" value="{{ form.diretoria }}">

            <div class="areas">
                <p>Áreas</p>
                <div class="dropdown">
                    <button type="button" class="dropdown-btn" id="abrirAreas">
                        <span>Selecione as áreas</span>
                        <img class="seta" id="setaAreas" src="{% static 'imgs/seta-baixo.png' %}" alt="">
                    </button>
                    <div class="lista" id="listaAreas">
                        <label><input type="checkbox" name="areas" value="Cenário"> Cenário</label>
                        <label><input type="checkbox" name="areas" value="Staff"> Staff</label>
                        <label><input type="checkbox" name="areas" value="Figurino"> Figurino</label>
                        <label><input type="checkbox" name="areas" value="Dança"> Dança</label>
                        <label><input type="checkbox" name="areas" value="Sonoplastia"> Sonoplastia</label>
                        <label><input type="checkbox" name="areas" value="Roteiro"> Roteiro</label>
                        <label><input type="checkbox" name="areas" value="Tampinhas"> Tampinhas</label>
                    </div>
                </div>
            </div>

            <div class="butao">
                <button type="submit">Cadastrar</button>
            </div>

            <p id="cadbutao">Já possui conta? <a href="{% url 'login' %}">Entrar</a></p>

        </section>
    </form>

</main>

<footer>
    <p>© 2026 ScriptA</p>
</footer>

<script>
    const SETA_BAIXO = "{% static 'imgs/seta-baixo.png' %}";
    const SETA_CIMA = "{% static 'imgs/seta-cima.png' %}";
</script>
<script src="{% static 'js/cadastro.js' %}"></script>
<script>
// Validação frontend antes de enviar
document.getElementById("form-cadastro").addEventListener("submit", function(e) {
    var matricula = document.querySelector("input[name='matricula']").value.trim();
    var senha     = document.querySelector("input[name='senha']").value;
    var diretoria = document.getElementById("diretoriaSelecionada").value;
    var erro = null;

    if (!matricula) {
        erro = "Informe a matrícula.";
    } else if (!/^\d+$/.test(matricula)) {
        erro = "A matrícula deve conter apenas números.";
    } else if (!senha) {
        erro = "Informe a senha.";
    } else if (!diretoria) {
        erro = "Selecione uma diretoria.";
    }

    if (erro) {
        e.preventDefault();
        toast(erro, "erro");
    }
});
</script>

<script src="{% static 'js/toast.js' %}"></script>
</body>
</html>
