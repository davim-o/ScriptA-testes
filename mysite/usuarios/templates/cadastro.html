{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptA</title>
    <link rel="icon" type="image/png" href="{% static 'imgs/favicon.png' %}">
    <link rel="shortcut icon" href="{% static 'imgs/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
</head>

<body>

<header>
    <img src="{% static 'imgs/logo.png' %}" alt="Logo ScriptA">
    <h1>Participe da torcida</h1>
</header>

<main>

    <section class="imagens">
        <div class="mascote-item mascote-tigre">
            <img src="{% static 'imgs/tigre.png' %}" alt="Tigre">
            <span class="olho-mascote olho-esq">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
            <span class="olho-mascote olho-dir">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
        </div>
        <div class="mascote-item mascote-cobra">
            <img src="{% static 'imgs/cobra.png' %}" alt="Cobra">
            <span class="olho-mascote olho-esq">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
            <span class="olho-mascote olho-dir">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
        </div>
        <div class="mascote-item mascote-dragao">
            <img src="{% static 'imgs/dragao.png' %}" alt="Dragão">
            <span class="olho-mascote olho-esq">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
            <span class="olho-mascote olho-dir">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
        </div>
        <div class="mascote-item mascote-cavalo">
            <img src="{% static 'imgs/cavalo.png' %}" alt="Cavalo">
            <span class="olho-mascote olho-esq">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
            <span class="olho-mascote olho-dir">
                <span class="pupila-mascote"></span>
                <span class="palpebra-mascote"><svg viewBox="0 0 24 16"><path d="M 3 5 Q 12 13 21 5"/></svg></span>
            </span>
        </div>
    </section>

    <form method="POST" id="form-cadastro">
        {% csrf_token %}

        <section class="formula">

            <div class="mat">
                <p>Matrícula</p>
                <input type="text" id="matricula-cadastro" name="matricula" placeholder="Matrícula do SUAP"
                       value="{{ form.matricula }}" maxlength="20" required>
            </div>

            <div class="senha">
                <p>Senha</p>
                <div class="campo-senha">
                    <input type="password" id="senha" name="senha" placeholder="Senha do SUAP" required>
                    <button type="button" class="btn-toggle-senha" id="toggle-senha-cadastro" aria-label="Mostrar senha" title="Mostrar/ocultar senha">
                        <svg class="icone-olho-aberto" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icone-olho-fechado" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="diretoria">
                <p>Diretoria</p>
                <input type="text" name="diretoria" id="diretoriaSelecionada"
                       value="{{ form.diretoria }}"
                       placeholder="Preenchida pela matrícula"
                       readonly tabindex="-1" class="input-diretoria-auto">
            </div>

            <div class="areas">
                <p>Áreas</p>
                <div class="dropdown">
                    <button type="button" class="dropdown-btn" id="abrirAreas">
                        <span id="textoAreasSelecionadas" class="placeholder-ghost">Selecione as áreas (opcional)</span>
                        <img class="seta" id="setaAreas" src="{% static 'imgs/seta-baixo.png' %}" alt="">
                    </button>
                    <div class="lista" id="listaAreas">
                        <label><input type="checkbox" name="areas" value="Cenário" {% if "Cenário" in form.areas %}checked{% endif %}> Cenário</label>
                        <label><input type="checkbox" name="areas" value="Staff" {% if "Staff" in form.areas %}checked{% endif %}> Staff</label>
                        <label><input type="checkbox" name="areas" value="Figurino" {% if "Figurino" in form.areas %}checked{% endif %}> Figurino</label>
                        <label><input type="checkbox" name="areas" value="Dança" {% if "Dança" in form.areas %}checked{% endif %}> Dança</label>
                        <label><input type="checkbox" name="areas" value="Sonoplastia" {% if "Sonoplastia" in form.areas %}checked{% endif %}> Sonoplastia</label>
                        <label><input type="checkbox" name="areas" value="Roteiro" {% if "Roteiro" in form.areas %}checked{% endif %}> Roteiro</label>
                        <label><input type="checkbox" name="areas" value="Tampinhas" {% if "Tampinhas" in form.areas %}checked{% endif %}> Tampinhas</label>
                    </div>
                </div>
            </div>

            {% if erro %}
            <p class="erro-login">{{ erro }}</p>
            {% endif %}

            <div class="butao">
                <button type="submit">Cadastrar</button>
            </div>

            <p id="cadbutao">Já possui conta? <a href="{% url 'login' %}">Entrar</a></p>

        </section>
    </form>

</main>

<footer>
    <p>© 2026 ScriptA. Todos os direitos reservados.</p>
</footer>

<script>
    const SETA_BAIXO = "{% static 'imgs/seta-baixo.png' %}";
    const SETA_CIMA = "{% static 'imgs/seta-cima.png' %}";
</script>
<script src="{% static 'js/mascotes.js' %}"></script>
<script src="{% static 'js/cadastro.js' %}"></script>


<script src="{% static 'js/toast.js' %}"></script>
</body>
</html>
